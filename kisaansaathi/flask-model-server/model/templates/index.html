<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-6">Plant Disease Detector</h1>
        
        <form id="upload-form" class="space-y-6" enctype="multipart/form-data" action="http://127.0.0.1:5000/predict" method="POST">
            <!-- Language Selection -->
            <div class="space-y-2">
                <label for="language" class="block text-sm font-medium text-gray-700">Language</label>
                <select id="language" class="w-full p-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                </select>
            </div>
            
            <!-- Image Upload -->
            <div class="space-y-2">
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-6">
                    <input 
                        type="file" 
                        id="image-upload" 
                        name="file"
                        accept="image/*" 
                        class="hidden"
                    >
                    <label 
                        for="image-upload" 
                        class="cursor-pointer bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors duration-200 flex items-center space-x-2"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        <span>Select Image</span>
                    </label>
                    <p id="file-name" class="text-sm text-gray-500 mt-2">No file chosen</p>
                </div>
                
                <!-- Preview Container -->
                <div id="preview-container" class="hidden mt-4">
                    <p class="text-sm text-gray-700 mb-2">Preview:</p>
                    <div class="border rounded-lg overflow-hidden">
                        <img id="image-preview" src="#" alt="Image Preview" class="w-full h-48 object-contain bg-gray-100">
                    </div>
                </div>
            </div>
            
            <!-- Predict Button -->
            <div>
                <button 
                    type="submit" 
                    id="predict-btn" 
                    class="w-full bg-green-600 text-white py-3 px-4 rounded-lg hover:bg-green-700 transition-colors duration-200 font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled
                >
                    Detect Disease
                </button>
            </div>
            
            <!-- Results Container -->
            <div id="result-container" class="hidden mt-6 space-y-4">
                <h2 class="text-xl font-semibold text-green-800 border-b pb-2">Results</h2>
                
                <div class="space-y-2">
                    <h3 class="text-lg font-medium text-gray-900" id="prediction-title"></h3>
                    <p class="text-sm text-gray-600">
                        <span class="font-medium">Confidence:</span> 
                        <span id="confidence-score" class="font-bold text-green-600"></span>
                    </p>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="font-medium text-gray-900 mb-1">Cause</h4>
                    <p id="cause-text" class="text-gray-700 text-sm"></p>
                    
                    <h4 class="font-medium text-gray-900 mt-4 mb-1">Remedy</h4>
                    <p id="remedy-text" class="text-gray-700 text-sm"></p>
                </div>
            </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const fileName = document.getElementById('file-name');
        const predictBtn = document.getElementById('predict-btn');
        const uploadForm = document.getElementById('upload-form');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const resultContainer = document.getElementById('result-container');
        const predictionTitle = document.getElementById('prediction-title');
        const confidenceScore = document.getElementById('confidence-score');
        const causeText = document.getElementById('cause-text');
        const remedyText = document.getElementById('remedy-text');
        const languageSelect = document.getElementById('language');

        imageUpload.addEventListener('change', function(event) {
            if (this.files && this.files[0]) {
                fileName.textContent = this.files[0].name;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(this.files[0]);
                
                predictBtn.disabled = false;
            }
        });

        uploadForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            if (!imageUpload.files || !imageUpload.files[0]) {
                alert('Please select an image first');
                return;
            }
            
            const formData = new FormData(uploadForm);
            
            try {
                // Show loading state
                predictBtn.disabled = true;
                predictBtn.textContent = 'Processing...';
                resultContainer.classList.add('hidden');
                
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Show results
                resultContainer.classList.remove('hidden');
                const diseaseName = data.disease ? data.disease.replace(/_/g, ' ').replace(/\s+/g, ' ') : 'Unknown';
                predictionTitle.textContent = diseaseName;
                confidenceScore.textContent = data.confidence ? `${(data.confidence * 100).toFixed(2)}%` : 'N/A';
                
                // Parse advice if available
                const advice = data.advice || 'No advice available';
                const causeMatch = advice.match(/[cC]ause[\s:]*(.*?)(?=[rR]emedy|$)/s);
                const remedyMatch = advice.match(/[rR]emedy[\s:]*(.*)/s);
                
                causeText.textContent = causeMatch ? causeMatch[1].trim() : advice;
                remedyText.textContent = remedyMatch ? remedyMatch[1].trim() : '';
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + (error.message || 'Failed to process image. Please try again.'));
            } finally {
                predictBtn.disabled = false;
                predictBtn.textContent = 'Detect Disease';
            }
        });
    </script>
        </form>
    </div>
</body>
</html>
